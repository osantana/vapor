services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: vapor
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d vapor"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/vapor
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  database:
