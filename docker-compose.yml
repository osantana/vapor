# The default values are for local development only. Override them in a .env file.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: vapor
      POSTGRES_USER: ${DATABASE_USER:-vapor}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-vapor-local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-vapor} -d vapor"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/vapor
      DATABASE_USER: ${DATABASE_USER:-vapor}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-vapor-local}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      DEMO_DATA: ${DEMO_DATA:-true}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  database:
