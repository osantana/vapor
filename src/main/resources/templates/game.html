<article class="game">
    <img src="{{cover}}" alt="">
    <div>
        <h1>{{title}}</h1>
        <p>{{genres}} {{platforms}}</p>
        <dl>
            <dt>{{msg:game.publisher}}</dt>
            <dd>{{publisher}}</dd>
            <dt>{{msg:game.releaseDate}}</dt>
            <dd>{{releaseDate}}</dd>
            <dt>{{msg:game.status}}</dt>
            <dd>{{status}}</dd>
            <dt>{{msg:game.price}}</dt>
            <dd class="price">{{price}}</dd>
        </dl>
        {{action}}
    </div>
</article>
<h2>{{msg:game.description}}</h2>
<p class="text">{{description}}</p>
<h2>{{msg:game.requirements}}</h2>
<p class="text">{{requirements}}</p>
