<article class="game">
    <img src="{{cover}}" alt="">
    <div>
        <h1>{{title}}</h1>
        <p>{{genres}} {{platforms}}</p>
        <dl>
            <dt>Publicador</dt>
            <dd>{{publisher}}</dd>
            <dt>Data de lançamento</dt>
            <dd>{{releaseDate}}</dd>
            <dt>Status</dt>
            <dd>{{status}}</dd>
            <dt>Preço</dt>
            <dd class="price">{{price}}</dd>
        </dl>
        {{action}}
    </div>
</article>
<h2>Descrição</h2>
<p class="text">{{description}}</p>
<h2>Requisitos de sistema</h2>
<p class="text">{{requirements}}</p>
