<h1>Catálogo</h1>
<form class="filters" method="get" action="/">
    <label>Buscar
        <input type="search" name="q" value="{{query}}">
    </label>
    <label>Gênero
        <select name="genre">
            <option value="">Todos</option>
            {{genreOptions}}
        </select>
    </label>
    <label>Plataforma
        <select name="platform">
            <option value="">Todos</option>
            {{platformOptions}}
        </select>
    </label>
    <label>Preço mínimo
        <input type="text" inputmode="decimal" name="min" value="{{min}}">
    </label>
    <label>Preço máximo
        <input type="text" inputmode="decimal" name="max" value="{{max}}">
    </label>
    <label>Lançado a partir de
        <input type="date" name="from" value="{{from}}">
    </label>
    <label>Ordenar por
        <select name="sort">
            {{sortOptions}}
        </select>
    </label>
    <button>Aplicar</button>
</form>
<section class="grid">
    {{cards}}
</section>
<p class="pagination">
    {{pagination}}
</p>
