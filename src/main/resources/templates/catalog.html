<h1>{{msg:catalog.title}}</h1>
<form class="filters" method="get" action="/">
    <label>{{msg:catalog.search}}
        <input type="search" name="q" value="{{query}}">
    </label>
    <label>{{msg:catalog.genre}}
        <select name="genre">
            <option value="">{{msg:catalog.all}}</option>
            {{genreOptions}}
        </select>
    </label>
    <label>{{msg:catalog.platform}}
        <select name="platform">
            <option value="">{{msg:catalog.all}}</option>
            {{platformOptions}}
        </select>
    </label>
    <label>{{msg:catalog.minimumPrice}}
        <input type="text" inputmode="decimal" name="min" value="{{min}}">
    </label>
    <label>{{msg:catalog.maximumPrice}}
        <input type="text" inputmode="decimal" name="max" value="{{max}}">
    </label>
    <label>{{msg:catalog.releasedFrom}}
        <input type="date" name="from" value="{{from}}">
    </label>
    <label>{{msg:catalog.sort}}
        <select name="sort">
            {{sortOptions}}
        </select>
    </label>
    <button>{{msg:catalog.apply}}</button>
</form>
<section class="grid">
    {{cards}}
</section>
<p class="pagination">
    {{pagination}}
</p>
