<h1>Publicar jogo</h1>
{{errors}}
<form class="stack" method="post" action="/publisher/games">
    <label>Título
        <input type="text" name="title" value="{{title}}" maxlength="200" required>
    </label>
    <label>Descrição
        <textarea name="description" rows="5" required>{{description}}</textarea>
    </label>
    <label>Requisitos de sistema
        <textarea name="requirements" rows="3">{{requirements}}</textarea>
    </label>
    <label>Endereço da imagem de capa
        <input type="url" name="coverUrl" value="{{coverUrl}}" maxlength="500">
    </label>
    <label>Preço (R$)
        <input type="text" inputmode="decimal" name="price" value="{{price}}" required>
        <small>Use 0 para jogo gratuito.</small>
    </label>
    <label>Data de lançamento
        <input type="date" name="releaseDate" value="{{releaseDate}}" required>
    </label>
    <fieldset>
        <legend>Gênero</legend>
        {{genres}}
    </fieldset>
    <fieldset>
        <legend>Arquivos de instalação</legend>
        <small>Preencha apenas as plataformas que o jogo suporta.</small>
        {{platforms}}
    </fieldset>
    <button>Enviar para análise</button>
</form>
