<div class="platform">
    <strong>{{name}}</strong>
    <label>{{msg:gameForm.fileUrl}}
        <input type="url" name="url_{{id}}" value="{{url}}" maxlength="500">
    </label>
    <label>{{msg:gameForm.fileSize}}
        <input type="text" inputmode="numeric" name="size_{{id}}" value="{{size}}">
    </label>
</div>
