<section class="order">
    <h2><a href="/games/{{id}}">{{title}}</a></h2>
    <p>Publicador: {{publisher}} &middot; {{price}}</p>
    <p class="text">{{description}}</p>
    <p>{{notes}}</p>
    <form class="stack" method="post" action="/admin/review">
        <input type="hidden" name="gameId" value="{{id}}">
        <label>Notas para o publicador
            <textarea name="notes" rows="2"></textarea>
        </label>
        <p>
            <button name="decision" value="approve">Aprovar</button>
            <button name="decision" value="changes">Solicitar ajustes</button>
            <button name="decision" value="reject">Rejeitar</button>
        </p>
    </form>
</section>
