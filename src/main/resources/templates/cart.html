<h1>Carrinho</h1>
<table>
    <thead>
    <tr>
        <th>Jogo</th>
        <th>Preço</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    {{items}}
    </tbody>
    <tfoot>
    <tr>
        <th>Total</th>
        <th colspan="2">{{total}}</th>
    </tr>
    </tfoot>
</table>
<h2>Pagamento</h2>
<form class="stack" method="post" action="/checkout">
    <label>
        <input type="radio" name="paymentMethod" value="pix" checked> PIX
    </label>
    <label>
        <input type="radio" name="paymentMethod" value="credit_card"> Cartão de crédito
    </label>
    <label>Número do cartão
        <input type="text" inputmode="numeric" name="cardNumber" autocomplete="off" maxlength="23">
        <small>Apenas para pagamento com cartão de crédito.</small>
    </label>
    <button>Confirmar compra</button>
</form>
