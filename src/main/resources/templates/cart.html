<h1>Carrinho</h1>
<table>
    <thead>
    <tr>
        <th>Jogo</th>
        <th>Preço</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    {{items}}
    </tbody>
    <tfoot>
    <tr>
        <th>Total</th>
        <th colspan="2">{{total}}</th>
    </tr>
    </tfoot>
</table>
<h2>Pagamento</h2>
<form class="stack" method="post" action="/checkout">
    <input type="hidden" name="paymentMethod" value="pix">
    <button>Pagar com PIX</button>
</form>
<form class="stack" method="post" action="/checkout">
    <input type="hidden" name="paymentMethod" value="credit_card">
    <label>Número do cartão
        <input type="text" inputmode="numeric" name="cardNumber" autocomplete="off" maxlength="23" required>
    </label>
    <button>Pagar com cartão de crédito</button>
</form>
