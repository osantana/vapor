<h1>{{msg:cart.title}}</h1>
<table>
    <thead>
    <tr>
        <th>{{msg:cart.game}}</th>
        <th>{{msg:game.price}}</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    {{items}}
    </tbody>
    <tfoot>
    <tr>
        <th>{{msg:cart.total}}</th>
        <th colspan="2">{{total}}</th>
    </tr>
    </tfoot>
</table>
<h2>{{msg:cart.payment}}</h2>
<form class="stack" method="post" action="/checkout">
    <input type="hidden" name="csrf" value="{{csrf}}">
    <label>
        <input type="radio" name="paymentMethod" value="pix" checked> {{msg:payment.pix}}
    </label>
    <label>
        <input type="radio" name="paymentMethod" value="credit_card"> {{msg:payment.credit_card}}
    </label>
    <label>{{msg:cart.cardNumber}}
        <input type="text" inputmode="numeric" name="cardNumber" autocomplete="off" maxlength="23">
        <small>{{msg:cart.cardHint}}</small>
    </label>
    <button>{{msg:cart.confirm}}</button>
</form>
